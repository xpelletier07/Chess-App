services:
  client:
    build:
      context: ./app/Client
      target: build
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./app/Client:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      server:
        condition: service_started

  server:
    build: ./app/Serveur
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/chess_app
      JWT_SECRET: cle-locale-chess-app
      # Identifiants de l'application OAuth GitHub; la connexion externe échoue explicitement s'ils manquent.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # L'URL de callback doit correspondre à celle déclarée dans GitHub.
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3000/auth/github/callback}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    volumes:
      - ./app/Serveur:/app
      - /app/node_modules
    command: npm start
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/Serveur/db/db.sql:/docker-entrypoint-initdb.d/db.sql:ro
      - ./app/Serveur/db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chess_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
